name: Print Software Versions

on:
  push:
    branches: main

jobs:
  PrintLanguageVersions:
    runs-on: ubuntu-latest
    steps:
      - name: Print Java Version
        run: java --version
      - name: Print Node Version
        run: node --version
      - name: Print Python Version
        run: python3 --version

  PrintDBMSVersions:
    runs-on: ubuntu-latest
    needs: [PrintLanguageVersions]
    steps:
      - name: Install and Print MongoDB Version
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg curl
          KEY_URL="https://www.mongodb.org/static/pgp/server-8.0.asc"
          KEY_PATH="/usr/share/keyrings/mongodb-server-8.0.gpg"
          curl -fsSL "$KEY_URL" | sudo gpg -o "$KEY_PATH" --dearmor
          REPO="https://repo.mongodb.org/apt/ubuntu"
          LINE="deb [ arch=amd64,arm64 signed-by=$KEY_PATH ] $REPO noble/mongodb-org/8.0 multiverse"
          echo "$LINE" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org
          mongod --version
